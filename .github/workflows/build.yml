name: Build Android APK (Java + NDK)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true
        -Dkotlin.incremental=true
      ANDROID_API: "34"
      BUILD_TOOLS_VERSION: "34.0.0"
      NDK_VERSION: "26.1.10909125"
      CMAKE_VERSION: "3.22.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_API }}

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'settings.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK components
        uses: actions/cache@v4
        id: cache-android
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/platform-tools
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
            ${{ env.ANDROID_SDK_ROOT }}/ndk
            ${{ env.ANDROID_SDK_ROOT }}/cmake
            ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: ${{ runner.os }}-android-sdk-${{ env.ANDROID_API }}-${{ env.BUILD_TOOLS_VERSION }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install Android SDK components
        if: steps.cache-android.outputs.cache-hit != 'true'
        run: |
          set -eux

          echo "Android SDK root: $ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager || true)
          fi

          if [ -z "${SDKMANAGER:-}" ]; then
            echo "sdkmanager not found"
            ls -la "$ANDROID_SDK_ROOT" || true
            exit 1
          fi

          yes | "$SDKMANAGER" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | "$SDKMANAGER" --licenses || true

      - name: Show installed SDK/NDK
        run: |
          set -eux

          echo "SDK root: $ANDROID_SDK_ROOT"

          ls -la "$ANDROID_SDK_ROOT" || true

          echo "NDK:"
          ls -la "$ANDROID_SDK_ROOT/ndk" || true

          echo "Build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Clean project
        run: ./gradlew clean --no-daemon

      # ==========================================
      # DEBUG BUILD
      # ==========================================

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK
        run: |
          set -eux

          echo "Debug APK:"
          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ==========================================
      # RELEASE BUILD
      # ==========================================

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        run: |
          set -eux

          echo "Release APK:"
          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ==========================================
      # GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}